<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工項管理工具</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root{
  --bg:#f5f4f0;--surface:#fff;--surface2:#f9f8f6;--border:#e2e0d8;--border-strong:#c8c6bc;
  --text:#1a1a18;--text2:#5a5a56;--text3:#9a9a94;
  --accent:#185FA5;--accent-bg:#E6F1FB;--accent-text:#185FA5;
  --success:#1D9E75;--success-bg:#E1F5EE;--success-text:#0F6E56;
  --warning-bg:#FAEEDA;--warning-text:#854F0B;
  --radius:8px;--shadow:0 1px 4px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1a1a18;--surface:#252522;--surface2:#2e2e2b;--border:#3a3a36;--border-strong:#4a4a46;--text:#e8e8e2;--text2:#a0a09a;--text3:#666660;}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:900px;margin:0 auto;padding:1.5rem 1rem 4rem}
.app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.app-title{font-size:20px;font-weight:600}
.sync-status{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--surface2);border:0.5px solid var(--border);color:var(--text2);display:flex;align-items:center;gap:5px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#ccc;transition:background .3s}
.sync-dot.ok{background:var(--success)}.sync-dot.err{background:#E24B4A}.sync-dot.syncing{background:#BA7517;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.tabs{display:flex;gap:6px;margin-bottom:1.25rem;flex-wrap:wrap}
.tab{padding:7px 16px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--surface);color:var(--text2);cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:5px;transition:all .15s}
.tab:hover{background:var(--surface2)}.tab.active{background:var(--text);color:var(--bg);border-color:transparent}
.toolbar{display:flex;gap:8px;margin-bottom:.75rem;align-items:center}
.toolbar input[type=text]{flex:1;height:36px;font-size:13px;padding:0 10px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--surface);color:var(--text);outline:none}
.sort-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:1rem;flex-wrap:wrap;padding:8px 12px;background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius)}
.sort-toolbar label{font-size:12px;color:var(--text3)}
.sort-toolbar select{font-size:12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:4px 8px;background:var(--bg);color:var(--text);cursor:pointer}
.btn{padding:7px 14px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:all .15s}
.btn:hover{background:var(--surface2)}.btn.primary{background:var(--accent);color:#fff;border-color:transparent}.btn.primary:hover{opacity:.88}
.btn.success-btn{background:var(--success);color:#fff;border-color:transparent;font-size:12px;padding:4px 11px;border-radius:20px;flex-shrink:0}.btn.success-btn:hover{opacity:.88}
.btn.export-btn{background:#185FA5;color:#fff;border-color:transparent}.btn.export-btn:hover{background:#0C447C}
.btn.sm{padding:3px 8px;font-size:12px}.btn.danger{color:#E24B4A;border-color:#f7c1c1}
/* Group */
.group{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;margin-bottom:.75rem;box-shadow:var(--shadow)}
.group-header{display:flex;align-items:center;gap:8px;padding:.75rem 1rem;user-select:none}
.group-header-click{display:flex;align-items:center;gap:8px;flex:1;cursor:pointer;min-width:0}
.color-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.group-title{font-size:20px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-badge{font-size:12px;padding:2px 9px;border-radius:20px;background:var(--accent-bg);color:var(--accent-text);flex-shrink:0}
.tag-badge{font-size:11px;padding:2px 8px;border-radius:20px;background:#EEEDFE;color:#3C3489;font-weight:500;flex-shrink:0}
.chevron{font-size:15px;color:var(--text3);transition:transform .2s;flex-shrink:0}.chevron.open{transform:rotate(180deg)}
.group-body{border-top:0.5px solid var(--border)}
/* More menu */
.more-btn{padding:4px 7px;border-radius:var(--radius);border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:16px;display:inline-flex;align-items:center;flex-shrink:0}
.more-btn:hover{background:var(--surface2);color:var(--text)}
.more-menu-wrap{position:relative;flex-shrink:0}
.more-menu{position:absolute;right:0;top:110%;background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:50;min-width:110px;overflow:hidden}
.more-menu-item{padding:9px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.more-menu-item:hover{background:var(--surface2)}
.more-menu-item.danger{color:#E24B4A}
/* Sub item */
.sub-item{padding:.9rem 1rem .9rem 2.25rem;border-bottom:0.5px solid var(--border);background:var(--surface2)}
.sub-item:last-child{border-bottom:none}
.sub-title-row{display:flex;align-items:center;gap:8px;margin-bottom:.6rem}
.sub-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.sub-title{font-size:18px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-badge{font-size:12px;padding:3px 9px;border-radius:20px;font-weight:500;white-space:nowrap;flex-shrink:0}
.priority-badge{font-size:11px;padding:2px 7px;border-radius:20px;font-weight:500;white-space:nowrap;flex-shrink:0}
/* Progress — fixed width to prevent drift */
.prog-wrap{display:flex;align-items:center;gap:6px;width:180px;flex-shrink:0}
.prog-pct{font-size:12px;font-weight:500;color:var(--text2);width:32px;text-align:right;flex-shrink:0}
input[type=range].prog-slider{width:100px;flex-shrink:0;height:4px;cursor:pointer;border:none;background:none;display:block}
.sub-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}
/* Meta */
.meta-fields{display:flex;flex-direction:column;gap:7px;margin-top:.5rem}
.meta-field label{font-size:12px;color:var(--text3);display:block;margin-bottom:3px}
.meta-field input[type=text],.meta-field textarea{width:100%;font-size:13px;border:0.5px solid var(--border);border-radius:var(--radius);padding:5px 8px;background:var(--bg);color:var(--text);font-family:inherit;outline:none}
.meta-field textarea{resize:none;height:52px}
/* Flat */
.flat-item{background:var(--surface);border:0.5px solid var(--border);border-radius:10px;margin-bottom:.6rem;padding:.85rem 1rem;box-shadow:var(--shadow)}
.flat-group-label{font-size:11px;color:var(--text3);margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* Priority/status colors */
.pri-high{background:#FAECE7;color:#993C1D}.pri-mid{background:#FAEEDA;color:#854F0B}.pri-low{background:#EAF3DE;color:#3B6D11}
.st-todo{background:var(--warning-bg);color:var(--warning-text)}.st-prog{background:var(--accent-bg);color:var(--accent-text)}.st-done{background:var(--success-bg);color:var(--success-text)}
/* Matrix */
.matrix-wrap{margin-top:.5rem}
.axis-labels{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.axis-label{font-size:11px;color:var(--text3);text-align:center;padding:3px 0;border:0.5px dashed var(--border);border-radius:var(--radius)}
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quadrant{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:.85rem;min-height:150px;box-shadow:var(--shadow)}
.q-label{font-size:12px;font-weight:500;margin-bottom:.6rem}
.q-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px 4px 7px;border-radius:20px;margin:3px 3px 3px 0;border:0.5px solid var(--border);background:var(--surface2);cursor:pointer;transition:background .15s}
.q-chip:hover{background:var(--accent-bg)}
.q-chip .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
/* Accomplish */
.acc-toolbar{display:flex;justify-content:flex-end;align-items:center;margin-bottom:1rem;gap:8px;flex-wrap:wrap}
.acc-group{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;margin-bottom:.75rem;box-shadow:var(--shadow);overflow:hidden}
.acc-group-hdr{display:flex;align-items:center;gap:8px;padding:.7rem 1rem;background:var(--surface2);border-bottom:0.5px solid var(--border)}
.acc-group-name{font-size:20px;font-weight:500;flex:1}
.acc-item{padding:.85rem 1rem .85rem 2rem;border-bottom:0.5px solid var(--border)}.acc-item:last-child{border-bottom:none}
.acc-item-row{display:flex;align-items:flex-start;gap:8px}
.acc-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:5px}
.acc-info{flex:1;min-width:0}
.acc-name{font-size:18px;font-weight:500;margin-bottom:4px}
.acc-ts{font-size:13px;color:var(--text3);display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.acc-note{font-size:13px;color:var(--text2);background:var(--surface2);border-radius:var(--radius);padding:6px 9px;border:0.5px solid var(--border);line-height:1.6}
/* Export */
.export-section{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.export-section h3{font-size:15px;font-weight:500;margin-bottom:.5rem;display:flex;align-items:center;gap:6px}
.export-section p{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:.9rem}
.export-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.export-row input{flex:1;min-width:0;height:36px;font-size:13px;padding:0 10px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--bg);color:var(--text);outline:none}
.gs-connected{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--success);font-weight:500}
.info-box{background:var(--accent-bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:.75rem 1rem;font-size:12px;color:var(--text2);line-height:1.7;margin-top:.75rem}
/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);background:#1a1a18;color:#fff;padding:9px 22px;border-radius:20px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;padding-top:60px;z-index:300}
.modal{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:1.5rem;width:420px;max-width:95vw;max-height:88vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal h3{font-size:16px;font-weight:600;margin-bottom:1.1rem}
.form-group{margin-bottom:.85rem}
.form-group label{font-size:13px;color:var(--text2);display:block;margin-bottom:5px;font-weight:500}
.form-group input,.form-group select,.form-group textarea{width:100%;font-size:14px;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:8px 10px;background:var(--bg);color:var(--text);font-family:inherit;outline:none}
.form-group textarea{resize:vertical;height:70px}
.color-picker{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0}
.color-opt{width:24px;height:24px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color .15s}
.color-opt.sel{border-color:var(--text)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:1.1rem}
.tag-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 10px;border-radius:20px;background:#EEEDFE;color:#3C3489;border:0.5px solid #c5c2f0}
.tag-chip-del{cursor:pointer;font-size:15px;line-height:1;color:#6b67c0}.tag-chip-del:hover{color:#E24B4A}
.tag-manage{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;min-height:32px}
.hidden{display:none}
.empty{text-align:center;padding:3rem;color:var(--text3);font-size:14px}
</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <span class="app-title"><i class="ti ti-clipboard-list" style="font-size:18px;vertical-align:-2px;margin-right:6px"></i>工項管理工具</span>
    <span class="sync-status" id="syncStatus"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">載入中...</span></span>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('list')"><i class="ti ti-list"></i> 清單</button>
    <button class="tab" onclick="switchTab('matrix')"><i class="ti ti-layout-grid"></i> 四象限矩陣</button>
    <button class="tab" onclick="switchTab('accomplish')"><i class="ti ti-circle-check"></i> Accomplish <span id="accBadge" class="hidden" style="background:var(--success);color:#fff;border-radius:20px;padding:0 7px;font-size:12px;margin-left:2px"></span></button>
    <button class="tab" onclick="switchTab('export')"><i class="ti ti-settings"></i> 設定與匯出</button>
  </div>

  <!-- LIST -->
  <div id="listView">
    <div class="toolbar">
      <button class="btn primary" onclick="openNewGroupModal()"><i class="ti ti-plus"></i> 新增大項目</button>
      <button class="btn sm" onclick="toggleAllGroups(true)" title="全部展開"><i class="ti ti-chevrons-down"></i></button>
      <button class="btn sm" onclick="toggleAllGroups(false)" title="全部折疊"><i class="ti ti-chevrons-up"></i></button>
      <input type="text" id="searchBox" placeholder="搜尋工項..." oninput="renderList()">
    </div>
    <div class="sort-toolbar">
      <label>檢視：</label>
      <select id="viewMode" onchange="onViewModeChange()">
        <option value="group">依大項目分組</option>
        <option value="flat">小項目排序</option>
      </select>
      <label id="sortLabel" class="hidden">排序：</label>
      <select id="sortBy" class="hidden" onchange="renderList()">
        <option value="pri">優先度</option>
        <option value="urg">緊急度</option>
        <option value="imp">重要度</option>
        <option value="tag">標籤</option>
      </select>
      <label>標籤篩選：</label>
      <select id="filterTag" onchange="renderList()"><option value="">全部</option></select>
    </div>
    <div id="listContainer"></div>
  </div>

  <!-- MATRIX -->
  <div id="matrixView" class="hidden">
    <div class="matrix-wrap">
      <div class="axis-labels"><div class="axis-label">← 不緊急</div><div class="axis-label">緊急 →</div></div>
      <div class="matrix">
        <div class="quadrant"><div class="q-label"><span style="background:#EEEDFE;color:#3C3489;padding:2px 9px;border-radius:10px">II 重要・不緊急</span></div><div id="chips-II"></div></div>
        <div class="quadrant"><div class="q-label"><span style="background:#FAECE7;color:#993C1D;padding:2px 9px;border-radius:10px">I 重要・緊急</span></div><div id="chips-I"></div></div>
        <div class="quadrant"><div class="q-label"><span style="background:#F1EFE8;color:#5F5E5A;padding:2px 9px;border-radius:10px">III 不重要・不緊急</span></div><div id="chips-III"></div></div>
        <div class="quadrant"><div class="q-label"><span style="background:#FAEEDA;color:#854F0B;padding:2px 9px;border-radius:10px">IV 不重要・緊急</span></div><div id="chips-IV"></div></div>
      </div>
    </div>
  </div>

  <!-- ACCOMPLISH -->
  <div id="accomplishView" class="hidden">
    <div class="acc-toolbar">
      <label style="font-size:13px;color:var(--text2)">標籤篩選：</label>
      <select id="accFilterTag" onchange="renderAccomplish()" style="font-size:13px;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:5px 9px;background:var(--bg);color:var(--text)"><option value="">全部</option></select>
      <label style="font-size:13px;color:var(--text2)">排序：</label>
      <select id="accSort" onchange="renderAccomplish()" style="font-size:13px;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:5px 9px;background:var(--bg);color:var(--text)">
        <option value="created">建立時間</option><option value="done">完成時間</option>
      </select>
    </div>
    <div id="accomplishContainer"></div>
  </div>

  <!-- EXPORT -->
  <div id="exportView" class="hidden">
    <div class="export-section">
      <h3><i class="ti ti-brand-google" style="font-size:16px"></i> Google Sheets 即時同步</h3>
      <p>每次新增、編輯、完成工項時自動同步至 Google Sheets。</p>
      <div id="gsFormArea">
        <div class="export-row">
          <input type="text" id="scriptUrlInput" placeholder="貼上 Apps Script 網址">
          <button class="btn primary" onclick="saveScriptUrl()"><i class="ti ti-plug"></i> 連接</button>
        </div>
        <div class="info-box">網址僅存於瀏覽器 localStorage，不會傳送至第三方。</div>
      </div>
      <div id="gsConnected" class="hidden">
        <span class="gs-connected"><i class="ti ti-circle-check"></i> 已連接 Google Sheets</span>
        <button class="btn sm" style="margin-left:12px" onclick="disconnectGSheet()">中斷連接</button>
        <div style="font-size:12px;color:var(--text3);margin-top:8px" id="gsSyncLog"></div>
      </div>
    </div>
    <div class="export-section">
      <h3><i class="ti ti-download" style="font-size:16px"></i> 匯出資料（報告用）</h3>
      <p>將所有工項與已完成紀錄打包匯出，可直接把 JSON 貼給 Claude 生成報表或年度成就報告；CSV 可用 Excel 開啟。</p>
      <div class="export-row">
        <button class="btn export-btn" onclick="exportJSON()"><i class="ti ti-brackets"></i> 匯出 JSON</button>
        <button class="btn export-btn" onclick="exportCSV()"><i class="ti ti-table"></i> 匯出 CSV</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- NEW GROUP MODAL -->
<div class="modal-bg hidden" id="newGroupModal" onclick="if(event.target===this)this.classList.add('hidden')">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="groupModalTitle">新增大項目</h3>
    <div class="form-group"><label>名稱</label><input type="text" id="ngName" placeholder="大項目名稱"></div>
    <div class="form-group"><label>緊急度</label><select id="ngUrg"><option value="urgent">緊急</option><option value="normal" selected>不緊急</option></select></div>
    <div class="form-group"><label>重要度</label><select id="ngImp"><option value="high">重要</option><option value="low" selected>不重要</option></select></div>
    <div class="form-group"><label>優先度</label><select id="ngPri"><option value="high">高</option><option value="mid" selected>中</option><option value="low">低</option></select></div>
    <div class="form-group"><label>顏色</label><div class="color-picker" id="ngColorPicker"></div></div>
    <div class="form-group">
      <label>標籤分類</label>
      <div style="display:flex;gap:8px;align-items:center">
        <select id="ngTag" style="flex:1;font-size:14px;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:8px 10px;background:var(--bg);color:var(--text)"></select>
        <button class="btn sm" onclick="openTagManager()" type="button"><i class="ti ti-pencil"></i> 管理</button>
      </div>
    </div>
    <input type="hidden" id="ngEditId">
    <div class="modal-btns">
      <button class="btn" onclick="closeGroupModal()">取消</button>
      <button class="btn primary" onclick="saveGroup()">儲存</button>
    </div>
  </div>
</div>

<!-- NEW SUB MODAL -->
<div class="modal-bg hidden" id="newSubModal" onclick="if(event.target===this)this.classList.add('hidden')">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="subModalTitle">新增小項目</h3>
    <div class="form-group"><label>名稱</label><input type="text" id="nsName" placeholder="小項目名稱"></div>
    <div class="form-group"><label>優先度</label><select id="nsPri"><option value="high">高</option><option value="mid" selected>中</option><option value="low">低</option></select></div>
    <div class="form-group"><label>顏色</label><div class="color-picker" id="nsColorPicker"></div></div>
    <div class="form-group"><label>備註</label><input type="text" id="nsRef" placeholder="備註說明"></div>
    <div class="form-group"><label>討論/說明</label><textarea id="nsNote" placeholder="需要討論或補充的事項..."></textarea></div>
    <input type="hidden" id="nsGid">
    <input type="hidden" id="nsEditId">
    <div class="modal-btns">
      <button class="btn" onclick="document.getElementById('newSubModal').classList.add('hidden')">取消</button>
      <button class="btn primary" onclick="saveSub()">儲存</button>
    </div>
  </div>
</div>

<!-- EDIT ACC MODAL -->
<div class="modal-bg hidden" id="editAccModal" onclick="if(event.target===this)this.classList.add('hidden')">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>編輯已完成工項</h3>
    <div class="form-group"><label>建立時間</label><input type="datetime-local" id="eaCreated"></div>
    <div class="form-group"><label>完成時間</label><input type="datetime-local" id="eaDone"></div>
    <div class="form-group"><label>討論/說明</label><textarea id="eaNote" style="height:90px"></textarea></div>
    <input type="hidden" id="eaId">
    <div class="modal-btns">
      <button class="btn" onclick="document.getElementById('editAccModal').classList.add('hidden')">取消</button>
      <button class="btn primary" onclick="saveEditAcc()">儲存</button>
    </div>
  </div>
</div>

<!-- TAG MANAGER MODAL -->
<div class="modal-bg hidden" id="tagModal" onclick="if(event.target===this)this.classList.add('hidden')">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>管理標籤分類</h3>
    <div class="tag-manage" id="tagList"></div>
    <div style="display:flex;gap:8px;margin-top:1rem">
      <input type="text" id="newTagInput" placeholder="新增標籤名稱..." style="flex:1;font-size:13px;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:7px 9px;background:var(--bg);color:var(--text)">
      <button class="btn primary" onclick="addTag()"><i class="ti ti-plus"></i> 新增</button>
    </div>
    <div class="modal-btns"><button class="btn" onclick="document.getElementById('tagModal').classList.add('hidden')">完成</button></div>
  </div>
</div>

<script>
const COLORS=['#D85A30','#1D9E75','#378ADD','#D4537E','#7F77DD','#BA7517','#639922','#888780'];
const LS_DATA='taskmanager_data';
const LS_GS='taskmanager_gs_url';
const LS_TAGS='taskmanager_tags';
const DEFAULT_TAGS=['面談','招募/錄取','入職','離職','其他'];
const DEFAULT_SCRIPT_URL='https://script.google.com/macros/s/AKfycbxgHAx_DjHoivLJfC7LOyWitAHfhiWwjQ_umymFqqexFWYUxDWZjEGhJw1x_VM0H3c6nw/exec';

let data={groups:[],accomplished:[]};
let scriptUrl='';
let tags=[...DEFAULT_TAGS];
let _ngColor=COLORS[0],_nsColor=COLORS[0];
let _db={};

function save(){try{localStorage.setItem(LS_DATA,JSON.stringify(data));}catch(e){}}
function load(){try{const d=localStorage.getItem(LS_DATA);if(d)data=JSON.parse(d);}catch(e){}}
function loadGS(){try{const u=localStorage.getItem(LS_GS);scriptUrl=u||DEFAULT_SCRIPT_URL;if(!u)localStorage.setItem(LS_GS,DEFAULT_SCRIPT_URL);}catch(e){scriptUrl=DEFAULT_SCRIPT_URL;}}
function loadTags(){try{const t=localStorage.getItem(LS_TAGS);if(t)tags=JSON.parse(t);}catch(e){}}
function saveTags(){try{localStorage.setItem(LS_TAGS,JSON.stringify(tags));}catch(e){}}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function fmtTs(ts){if(!ts)return'—';const d=new Date(ts);return d.toLocaleDateString('zh-TW')+' '+d.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}
function toLocal(ts){if(!ts)return'';const d=new Date(ts);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function getYear(ts){return ts?new Date(ts).getFullYear():new Date().getFullYear()}
function statusLabel(p){return p===0?'待辦':p===100?'完成':'進行中'}
function statusClass(p){return p===0?'st-todo':p===100?'st-done':'st-prog'}
function priLabel(p){return p==='high'?'高':p==='mid'?'中':'低'}
function priClass(p){return p==='high'?'pri-high':p==='mid'?'pri-mid':'pri-low'}
function quadrant(urg,imp){if(imp==='high'&&urg==='urgent')return'I';if(imp==='high'&&urg==='normal')return'II';if(imp==='low'&&urg==='normal')return'III';return'IV'}
function priOrder(p){return p==='high'?0:p==='mid'?1:2}
function urgOrder(u){return u==='urgent'?0:1}
function impOrder(i){return i==='high'?0:1}
function sortGroups(){data.groups.sort((a,b)=>priOrder(a.pri)-priOrder(b.pri))}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function showToast(msg,color){const t=document.getElementById('toast');t.textContent=msg;t.style.background=color||'#1a1a18';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
function setSyncStatus(state,label){const dot=document.getElementById('syncDot');dot.className='sync-dot'+(state==='ok'?' ok':state==='err'?' err':state==='syncing'?' syncing':'');document.getElementById('syncLabel').textContent=label;}
function setSyncLog(msg){const el=document.getElementById('gsSyncLog');if(el)el.textContent=msg;}

function buildColorPicker(cid,sel,cb){
  const cp=document.getElementById(cid);
  cp.innerHTML=COLORS.map(c=>`<div class="color-opt${c===sel?' sel':''}" style="background:${c}" data-c="${c}"></div>`).join('');
  cp.querySelectorAll('.color-opt').forEach(el=>el.onclick=()=>{cp.querySelectorAll('.color-opt').forEach(e=>e.classList.remove('sel'));el.classList.add('sel');cb(el.dataset.c)});
}

/* TAGS */
function buildTagSelect(selId,selectedVal){
  const sel=document.getElementById(selId);if(!sel)return;
  sel.innerHTML='<option value="">— 無 —</option>'+tags.map(t=>`<option value="${esc(t)}"${t===selectedVal?' selected':''}>${esc(t)}</option>`).join('');
}
function buildFilterTag(){
  ['filterTag','accFilterTag'].forEach(id=>{
    const sel=document.getElementById(id);if(!sel)return;
    const cur=sel.value;
    sel.innerHTML='<option value="">全部</option>'+tags.map(t=>`<option value="${esc(t)}"${t===cur?' selected':''}>${esc(t)}</option>`).join('');
  });
}
function openTagManager(){renderTagList();document.getElementById('tagModal').classList.remove('hidden');}
function renderTagList(){
  document.getElementById('tagList').innerHTML=tags.length
    ?tags.map((t,i)=>`<span class="tag-chip">${esc(t)}<span class="tag-chip-del" onclick="deleteTag(${i})">×</span></span>`).join('')
    :'<span style="font-size:12px;color:var(--text3)">尚無標籤</span>';
}
function addTag(){
  const inp=document.getElementById('newTagInput');const val=inp.value.trim();
  if(!val||tags.includes(val)){showToast('標籤已存在或名稱為空','#BA7517');return}
  tags.push(val);saveTags();inp.value='';renderTagList();buildTagSelect('ngTag','');buildFilterTag();
}
function deleteTag(i){tags.splice(i,1);saveTags();renderTagList();buildTagSelect('ngTag','');buildFilterTag();}

/* TABS */
function switchTab(t){
  ['list','matrix','accomplish','export'].forEach(v=>document.getElementById(v+'View').classList.toggle('hidden',v!==t));
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',['list','matrix','accomplish','export'][i]===t));
  if(t==='matrix')renderMatrix();if(t==='accomplish')renderAccomplish();if(t==='export')renderExportPage();
  document.querySelectorAll('.more-menu').forEach(m=>m.remove());
}

/* VIEW MODE */
function onViewModeChange(){
  const isFlat=document.getElementById('viewMode').value==='flat';
  document.getElementById('sortLabel').classList.toggle('hidden',!isFlat);
  document.getElementById('sortBy').classList.toggle('hidden',!isFlat);
  renderList();
}

/* COLLAPSE ALL */
function toggleAllGroups(open){data.groups.forEach(g=>g.open=open);save();renderList();}

/* MORE MENU */
function toggleMoreMenu(gid,btn){
  document.querySelectorAll('.more-menu').forEach(m=>{if(m.dataset.gid!==gid)m.remove();});
  const existing=document.querySelector(`.more-menu[data-gid="${gid}"]`);
  if(existing){existing.remove();return;}
  const menu=document.createElement('div');
  menu.className='more-menu';menu.dataset.gid=gid;
  menu.innerHTML=`<div class="more-menu-item" onclick="openEditGroupModal('${gid}')"><i class="ti ti-pencil"></i> 編輯</div><div class="more-menu-item danger" onclick="confirmDeleteGroup('${gid}')"><i class="ti ti-trash"></i> 刪除</div>`;
  btn.closest('.more-menu-wrap').appendChild(menu);
  setTimeout(()=>document.addEventListener('click',function handler(e){if(!menu.contains(e.target)&&e.target!==btn){menu.remove();document.removeEventListener('click',handler);}},{once:false}),10);
}

/* GROUP MODAL */
function openNewGroupModal(){
  document.getElementById('groupModalTitle').textContent='新增大項目';
  document.getElementById('ngName').value='';
  document.getElementById('ngUrg').value='normal';
  document.getElementById('ngImp').value='low';
  document.getElementById('ngPri').value='mid';
  document.getElementById('ngEditId').value='';
  _ngColor=COLORS[0];buildColorPicker('ngColorPicker',_ngColor,c=>{_ngColor=c});
  buildTagSelect('ngTag','');
  document.getElementById('newGroupModal').classList.remove('hidden');
  setTimeout(()=>document.getElementById('ngName').focus(),100);
}
function openEditGroupModal(gid){
  document.querySelectorAll('.more-menu').forEach(m=>m.remove());
  const g=data.groups.find(x=>x.id===gid);if(!g)return;
  document.getElementById('groupModalTitle').textContent='編輯大項目';
  document.getElementById('ngName').value=g.name;
  document.getElementById('ngUrg').value=g.urg||'normal';
  document.getElementById('ngImp').value=g.imp||'low';
  document.getElementById('ngPri').value=g.pri||'mid';
  document.getElementById('ngEditId').value=gid;
  _ngColor=g.color||COLORS[0];buildColorPicker('ngColorPicker',_ngColor,c=>{_ngColor=c});
  buildTagSelect('ngTag',g.tag||'');
  document.getElementById('newGroupModal').classList.remove('hidden');
  setTimeout(()=>document.getElementById('ngName').focus(),100);
}
function closeGroupModal(){document.getElementById('newGroupModal').classList.add('hidden');}
function saveGroup(){
  const name=document.getElementById('ngName').value.trim();if(!name)return;
  const editId=document.getElementById('ngEditId').value;
  const payload={name,pri:document.getElementById('ngPri').value,color:_ngColor,urg:document.getElementById('ngUrg').value,imp:document.getElementById('ngImp').value,tag:document.getElementById('ngTag').value};
  if(editId){
    const g=data.groups.find(x=>x.id===editId);if(g)Object.assign(g,payload);
  } else {
    data.groups.push({id:uid(),...payload,open:true,subs:[]});
  }
  sortGroups();save();closeGroupModal();buildFilterTag();renderList();
}
function confirmDeleteGroup(gid){
  document.querySelectorAll('.more-menu').forEach(m=>m.remove());
  const g=data.groups.find(x=>x.id===gid);if(!g)return;
  if(!confirm(`確定刪除「${g.name}」及其 ${g.subs.length} 個小項目？此動作無法復原。`))return;
  data.groups=data.groups.filter(x=>x.id!==gid);
  save();buildFilterTag();renderList();showToast(`「${g.name}」已刪除`);
}

/* SUB MODAL */
function openNewSubModal(gid){
  document.getElementById('subModalTitle').textContent='新增小項目';
  document.getElementById('nsName').value='';document.getElementById('nsRef').value='';document.getElementById('nsNote').value='';
  document.getElementById('nsGid').value=gid;document.getElementById('nsEditId').value='';
  _nsColor=COLORS[0];buildColorPicker('nsColorPicker',_nsColor,c=>{_nsColor=c});
  document.getElementById('newSubModal').classList.remove('hidden');setTimeout(()=>document.getElementById('nsName').focus(),100);
}
function openEditSubModal(gid,sid){
  const g=data.groups.find(x=>x.id===gid);const s=g&&g.subs.find(x=>x.id===sid);if(!s)return;
  document.getElementById('subModalTitle').textContent='編輯小項目';
  document.getElementById('nsName').value=s.name;
  document.getElementById('nsPri').value=s.pri;
  document.getElementById('nsRef').value=s.ref||'';
  document.getElementById('nsNote').value=s.note||'';
  document.getElementById('nsGid').value=gid;document.getElementById('nsEditId').value=sid;
  _nsColor=s.color||COLORS[0];buildColorPicker('nsColorPicker',_nsColor,c=>{_nsColor=c});
  document.getElementById('newSubModal').classList.remove('hidden');setTimeout(()=>document.getElementById('nsName').focus(),100);
}
function saveSub(){
  const name=document.getElementById('nsName').value.trim();if(!name)return;
  const gid=document.getElementById('nsGid').value;const editId=document.getElementById('nsEditId').value;
  const g=data.groups.find(x=>x.id===gid);if(!g)return;
  if(editId){
    const s=g.subs.find(x=>x.id===editId);
    if(s){s.name=name;s.pri=document.getElementById('nsPri').value;s.color=_nsColor;s.ref=document.getElementById('nsRef').value;s.note=document.getElementById('nsNote').value;save();syncRow(s,g,false);}
  } else {
    const sub={id:uid(),name,pri:document.getElementById('nsPri').value,color:_nsColor,prog:0,ref:document.getElementById('nsRef').value,note:document.getElementById('nsNote').value,createdAt:Date.now()};
    g.subs.push(sub);g.subs.sort((a,b)=>priOrder(a.pri)-priOrder(b.pri));save();syncRow(sub,g,false);
  }
  document.getElementById('newSubModal').classList.add('hidden');renderList();
}
function deleteSub(gid,sid){
  if(!confirm('確定刪除此小項目？此動作無法復原。'))return;
  const g=data.groups.find(x=>x.id===gid);if(!g)return;
  g.subs=g.subs.filter(x=>x.id!==sid);save();renderList();showToast('小項目已刪除');
}

/* COMPLETE */
function completeSub(gid,sid){
  const g=data.groups.find(x=>x.id===gid);if(!g)return;
  const si=g.subs.findIndex(x=>x.id===sid);if(si<0)return;
  const s=g.subs[si];
  const acc={...s,groupId:gid,groupName:g.name,groupColor:g.color,groupTag:g.tag||'',doneAt:Date.now()};
  data.accomplished.push(acc);g.subs.splice(si,1);
  save();updateAccBadge();renderList();syncRow(acc,g,true);
}
function updateAccBadge(){const b=document.getElementById('accBadge');if(data.accomplished.length){b.textContent=data.accomplished.length;b.classList.remove('hidden')}else b.classList.add('hidden');}

/* RENDER LIST */
function renderList(){
  const q=(document.getElementById('searchBox')||{}).value?.toLowerCase()||'';
  const filterTag=document.getElementById('filterTag').value;
  const viewMode=document.getElementById('viewMode').value;
  const c=document.getElementById('listContainer');
  document.querySelectorAll('.more-menu').forEach(m=>m.remove());

  if(viewMode==='flat'){
    const sortBy=document.getElementById('sortBy').value;
    let allSubs=[];
    data.groups.forEach(g=>{
      if(filterTag&&g.tag!==filterTag)return;
      g.subs.forEach(s=>{
        if(q&&!s.name.toLowerCase().includes(q)&&!g.name.toLowerCase().includes(q))return;
        allSubs.push({s,g});
      });
    });
    allSubs.sort((a,b)=>{
      if(sortBy==='pri')return priOrder(a.s.pri)-priOrder(b.s.pri);
      if(sortBy==='urg')return urgOrder(a.g.urg)-urgOrder(b.g.urg);
      if(sortBy==='imp')return impOrder(a.g.imp)-impOrder(b.g.imp);
      if(sortBy==='tag')return(a.g.tag||'').localeCompare(b.g.tag||'');
      return 0;
    });
    if(!allSubs.length){c.innerHTML='<div class="empty"><i class="ti ti-inbox" style="font-size:32px;display:block;margin-bottom:8px"></i>尚無符合的工項</div>';return}
    c.innerHTML=allSubs.map(({s,g})=>`<div class="flat-item">${subTitleRowHtml(s,g.id)}
<div class="flat-group-label">
  <span>所屬：</span>
  <span style="display:inline-flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:${g.color};display:inline-block"></span>${esc(g.name)}</span>
  ${g.tag?`<span class="tag-badge">${esc(g.tag)}</span>`:''}
  <span class="priority-badge ${g.urg==='urgent'?'pri-high':'pri-low'}" style="font-size:10px">緊急:${g.urg==='urgent'?'是':'否'}</span>
  <span class="priority-badge ${g.imp==='high'?'pri-high':'pri-low'}" style="font-size:10px">重要:${g.imp==='high'?'是':'否'}</span>
</div>
${subMetaHtml(s,g.id)}</div>`).join('');
  } else {
    const visible=data.groups.filter(g=>{
      if(filterTag&&g.tag!==filterTag)return false;
      return !q||g.name.toLowerCase().includes(q)||g.subs.some(s=>s.name.toLowerCase().includes(q));
    });
    if(!visible.length){c.innerHTML='<div class="empty"><i class="ti ti-inbox" style="font-size:32px;display:block;margin-bottom:8px"></i>尚無工項，按「新增大項目」開始</div>';return}
    c.innerHTML=visible.map(g=>{
      const isOpen=g.open!==false;
      const filtered=q?g.subs.filter(s=>s.name.toLowerCase().includes(q)||g.name.toLowerCase().includes(q)):g.subs;
      return`<div class="group">
<div class="group-header">
  <div class="group-header-click" onclick="toggleGroup('${g.id}')">
    <span class="color-dot" style="background:${g.color}"></span>
    <span class="group-title">${esc(g.name)}</span>
    ${g.tag?`<span class="tag-badge">${esc(g.tag)}</span>`:''}
    <span class="priority-badge ${priClass(g.pri)}">${priLabel(g.pri)}</span>
    <span class="group-badge">${filtered.length}</span>
    <i class="ti ti-chevron-down chevron${isOpen?' open':''}"></i>
  </div>
  <div class="more-menu-wrap">
    <button class="more-btn" onclick="toggleMoreMenu('${g.id}',this)" title="更多操作"><i class="ti ti-dots-vertical"></i></button>
  </div>
</div>
${isOpen?`<div class="group-body">${filtered.map(s=>subHtml(s,g.id)).join('')}<div style="padding:.6rem 1rem"><button class="btn sm" onclick="openNewSubModal('${g.id}')"><i class="ti ti-plus"></i> 新增小項目</button></div></div>`:''}</div>`;
    }).join('');
  }
}

function subTitleRowHtml(s,gid){
  const pct=s.prog||0;const barColor=pct===100?'#1D9E75':pct>0?'#378ADD':'#aaa';
  return`<div class="sub-title-row">
<span class="sub-dot" style="background:${s.color}"></span>
<span class="sub-title">${esc(s.name)}</span>
<span class="priority-badge ${priClass(s.pri)}">${priLabel(s.pri)}</span>
<span class="status-badge ${statusClass(pct)}">${statusLabel(pct)}</span>
<div class="prog-wrap">
  <input type="range" class="prog-slider" min="0" max="100" step="20" value="${pct}" oninput="updateProg('${gid}','${s.id}',+this.value)" style="accent-color:${barColor}">
  <span class="prog-pct" id="pp-${s.id}">${pct}%</span>
</div>
<div class="sub-actions">
  ${pct===100?`<button class="btn success-btn" onclick="completeSub('${gid}','${s.id}')"><i class="ti ti-check"></i> 完成</button>`:`<span style="width:62px;display:inline-block"></span>`}
  <button class="btn sm" onclick="openEditSubModal('${gid}','${s.id}')" title="編輯"><i class="ti ti-pencil"></i></button>
  <button class="btn sm danger" onclick="deleteSub('${gid}','${s.id}')" title="刪除"><i class="ti ti-trash"></i></button>
</div>
</div>`;
}

function subMetaHtml(s,gid){
  return`<div class="meta-fields">
<div class="meta-field"><label>備註</label><input type="text" value="${esc(s.ref||'')}" placeholder="備註說明" onchange="updateMeta('${gid}','${s.id}','ref',this.value)"></div>
<div class="meta-field"><label>討論/說明</label><textarea placeholder="需要討論或補充的事項..." onchange="updateMeta('${gid}','${s.id}','note',this.value)">${esc(s.note||'')}</textarea></div>
</div>`;
}

function subHtml(s,gid){return`<div class="sub-item" id="si-${s.id}">${subTitleRowHtml(s,gid)}${subMetaHtml(s,gid)}</div>`}

function toggleGroup(gid){const g=data.groups.find(x=>x.id===gid);if(g){g.open=!g.open;save();renderList();}}

function updateProg(gid,sid,val){
  const g=data.groups.find(x=>x.id===gid);const s=g&&g.subs.find(x=>x.id===sid);if(!s)return;
  s.prog=val;save();
  const el=document.getElementById('si-'+sid);
  const barColor=val===100?'#1D9E75':val>0?'#378ADD':'#aaa';
  if(el){
    const pp=el.querySelector('.prog-pct');if(pp)pp.textContent=val+'%';
    const slider=el.querySelector('.prog-slider');if(slider)slider.style.accentColor=barColor;
    const badge=el.querySelector('.status-badge');if(badge){badge.className='status-badge '+statusClass(val);badge.textContent=statusLabel(val)}
    const actions=el.querySelector('.sub-actions');
    if(actions){
      const doneBtn=actions.querySelector('.btn.success-btn');const ph=actions.querySelector('span[style*="width:62px"]');
      if(val===100&&!doneBtn){const btn=document.createElement('button');btn.className='btn success-btn';btn.innerHTML='<i class="ti ti-check"></i> 完成';btn.onclick=()=>completeSub(gid,sid);actions.insertBefore(btn,actions.firstChild);if(ph)ph.remove();}
      else if(val!==100&&doneBtn){doneBtn.remove();const sp=document.createElement('span');sp.style.cssText='width:62px;display:inline-block';actions.insertBefore(sp,actions.firstChild);}
    }
  }
  debouncedSync(s,g,false);
}
function updateMeta(gid,sid,field,val){
  const g=data.groups.find(x=>x.id===gid);const s=g&&g.subs.find(x=>x.id===sid);
  if(s){s[field]=val;save();debouncedSync(s,g,false);}
}
function debouncedSync(s,g,isDone){if(_db[s.id])clearTimeout(_db[s.id]);_db[s.id]=setTimeout(()=>syncRow(s,g,isDone),1200);}

/* MATRIX */
function renderMatrix(){
  const zones={I:[],II:[],III:[],IV:[]};
  data.groups.forEach(g=>{
    const q=quadrant(g.urg,g.imp);
    if(g.subs.length)g.subs.forEach(s=>zones[q].push({dot:s.color,label:`${s.name}`,sublabel:g.name,pri:s.pri,gid:g.id,sid:s.id}));
    else zones[q].push({dot:g.color,label:g.name,sublabel:'',pri:g.pri,gid:g.id,sid:null});
  });
  ['I','II','III','IV'].forEach(q=>{
    const el=document.getElementById('chips-'+q);if(!el)return;
    el.innerHTML=zones[q].length
      ?zones[q].map(c=>`<span class="q-chip" onclick="openEditFromMatrix('${c.gid}','${c.sid||''}')">
<span class="dot" style="background:${c.dot}"></span>
<span style="display:flex;flex-direction:column;line-height:1.3">
  <span>${esc(c.label)}</span>
  ${c.sublabel?`<span style="font-size:10px;color:var(--text3)">${esc(c.sublabel)}</span>`:''}
</span>
<span class="priority-badge ${priClass(c.pri)}" style="margin-left:4px;font-size:10px">${priLabel(c.pri)}</span>
</span>`).join('')
      :'<span style="font-size:12px;color:var(--text3)">無工項</span>';
  });
}

function openEditFromMatrix(gid,sid){
  if(sid)openEditSubModal(gid,sid);
  else openEditGroupModal(gid);
}

/* ACCOMPLISH */
function renderAccomplish(){
  const sort=document.getElementById('accSort').value;
  const filterTag=document.getElementById('accFilterTag').value;
  const c=document.getElementById('accomplishContainer');
  let items=data.accomplished.filter(a=>!filterTag||a.groupTag===filterTag);
  if(!items.length){c.innerHTML='<div class="empty"><i class="ti ti-trophy" style="font-size:32px;display:block;margin-bottom:8px"></i>尚無完成工項</div>';return}
  const sorted=[...items].sort((a,b)=>sort==='done'?(b.doneAt-a.doneAt):(b.createdAt-a.createdAt));
  const byGroup={};sorted.forEach(a=>{if(!byGroup[a.groupId])byGroup[a.groupId]={name:a.groupName,color:a.groupColor,tag:a.groupTag||'',items:[]};byGroup[a.groupId].items.push(a);});
  c.innerHTML=Object.entries(byGroup).map(([gid,grp])=>`<div class="acc-group">
<div class="acc-group-hdr">
  <span style="width:11px;height:11px;border-radius:50%;background:${grp.color};display:inline-block;flex-shrink:0"></span>
  <span class="acc-group-name">${esc(grp.name)}</span>
  ${grp.tag?`<span class="tag-badge">${esc(grp.tag)}</span>`:''}
  <span class="group-badge">${grp.items.length} 項完成</span>
</div>
${grp.items.map(a=>`<div class="acc-item"><div class="acc-item-row">
<span class="acc-dot" style="background:${a.color}"></span>
<div class="acc-info">
  <div class="acc-name">${esc(a.name)}</div>
  <div class="acc-ts">
    <span><i class="ti ti-clock" style="font-size:12px;vertical-align:-1px"></i> 建立 ${fmtTs(a.createdAt)}</span>
    <span><i class="ti ti-circle-check" style="font-size:12px;vertical-align:-1px;color:var(--success)"></i> 完成 ${fmtTs(a.doneAt)}</span>
  </div>
  ${a.note?`<div class="acc-note">${esc(a.note)}</div>`:''}
</div>
<button class="btn sm" onclick="openEditAcc('${a.id}')" style="flex-shrink:0;margin-left:6px"><i class="ti ti-pencil"></i></button>
</div></div>`).join('')}
</div>`).join('');
}

function openEditAcc(id){const a=data.accomplished.find(x=>x.id===id);if(!a)return;document.getElementById('eaId').value=id;document.getElementById('eaCreated').value=toLocal(a.createdAt);document.getElementById('eaDone').value=toLocal(a.doneAt);document.getElementById('eaNote').value=a.note||'';document.getElementById('editAccModal').classList.remove('hidden');}
function saveEditAcc(){
  const id=document.getElementById('eaId').value;const a=data.accomplished.find(x=>x.id===id);if(!a)return;
  const cr=document.getElementById('eaCreated').value;const dn=document.getElementById('eaDone').value;
  if(cr)a.createdAt=new Date(cr).getTime();if(dn)a.doneAt=new Date(dn).getTime();a.note=document.getElementById('eaNote').value;
  save();document.getElementById('editAccModal').classList.add('hidden');renderAccomplish();
  syncRow(a,{id:a.groupId,name:a.groupName,tag:a.groupTag},true);
}

/* EXPORT PAGE */
function renderExportPage(){
  if(scriptUrl){document.getElementById('gsFormArea').classList.add('hidden');document.getElementById('gsConnected').classList.remove('hidden');}
  else{document.getElementById('gsFormArea').classList.remove('hidden');document.getElementById('gsConnected').classList.add('hidden');}
}
function saveScriptUrl(){
  const u=document.getElementById('scriptUrlInput').value.trim();
  if(!u||!u.includes('script.google.com')){showToast('請貼入正確的 Apps Script 網址','#BA7517');return}
  scriptUrl=u;localStorage.setItem(LS_GS,u);renderExportPage();showToast('已儲存');pingScript();
}
function disconnectGSheet(){scriptUrl='';localStorage.removeItem(LS_GS);renderExportPage();setSyncStatus('','未連接 Google Sheets');showToast('已中斷連接');}
async function pingScript(){
  if(!scriptUrl)return;setSyncStatus('syncing','連接中...');
  try{await fetch(scriptUrl,{method:'GET',mode:'no-cors'});setSyncStatus('ok','已連接 Google Sheets');setSyncLog('連接正常');}
  catch(e){setSyncStatus('err','連接失敗');}
}

function rowFromItem(s,g,isDone){
  const gName=g.name||g.groupName||'';const gTag=g.tag||g.groupTag||'';
  return[getYear(s.createdAt),gName,gTag,s.name,priLabel(s.pri),statusLabel(isDone?100:s.prog),(isDone?100:(s.prog||0))+'%',s.ref||'',s.note||'',fmtTs(s.createdAt),isDone?fmtTs(s.doneAt):'',s.id];
}
async function syncRow(s,g,isDone){
  if(!scriptUrl)return;setSyncStatus('syncing','同步中...');
  try{
    const payload={action:'upsert',row:rowFromItem(s,g,isDone),id:s.id};
    await fetch(scriptUrl,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)});
    setSyncStatus('ok','已連接 Google Sheets');
    const ts=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    setSyncLog('上次同步：'+ts);
  }catch(e){setSyncStatus('err','同步失敗');}
}

function buildRows(){
  const rows=[];
  data.groups.forEach(g=>g.subs.forEach(s=>rows.push({年份:getYear(s.createdAt),大項目:g.name,標籤:g.tag||'',小項目:s.name,優先度:priLabel(s.pri),狀態:statusLabel(s.prog),進度:s.prog+'%',備註:s.ref||'',討論說明:s.note||'',建立時間:fmtTs(s.createdAt),完成時間:''})));
  data.accomplished.forEach(a=>rows.push({年份:getYear(a.createdAt),大項目:a.groupName,標籤:a.groupTag||'',小項目:a.name,優先度:priLabel(a.pri),狀態:'完成',進度:'100%',備註:a.ref||'',討論說明:a.note||'',建立時間:fmtTs(a.createdAt),完成時間:fmtTs(a.doneAt)}));
  rows.sort((a,b)=>b.年份-a.年份);return rows;
}
function exportJSON(){const rows=buildRows();if(!rows.length){showToast('尚無資料','#BA7517');return}const blob=new Blob([JSON.stringify(rows,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`工項資料_${new Date().toISOString().slice(0,10)}.json`;a.click();showToast('JSON 匯出完成 ✓');}
function exportCSV(){const rows=buildRows();if(!rows.length){showToast('尚無資料','#BA7517');return}const keys=Object.keys(rows[0]);const csv=[keys.join(','),...rows.map(r=>keys.map(k=>`"${String(r[k]).replace(/"/g,'""')}"`).join(','))].join('\n');const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`工項資料_${new Date().toISOString().slice(0,10)}.csv`;a.click();showToast('CSV 匯出完成 ✓');}

load();loadGS();loadTags();
buildFilterTag();
updateAccBadge();renderList();
if(scriptUrl){setSyncStatus('ok','已連接 Google Sheets');}else{setSyncStatus('','未連接 Google Sheets');}
</script>
