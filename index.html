<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工項管理工具</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root{
  --bg:#f5f4f0;--surface:#fff;--surface2:#f9f8f6;--border:#e2e0d8;--border-strong:#c8c6bc;
  --text:#1a1a18;--text2:#5a5a56;--text3:#9a9a94;
  --accent:#185FA5;--accent-bg:#E6F1FB;--accent-text:#185FA5;
  --success:#1D9E75;--success-bg:#E1F5EE;--success-text:#0F6E56;
  --warning-bg:#FAEEDA;--warning-text:#854F0B;
  --danger:#E24B4A;--danger-bg:#FCEBEB;
  --radius:8px;--shadow:0 1px 4px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1a1a18;--surface:#252522;--surface2:#2e2e2b;--border:#3a3a36;--border-strong:#4a4a46;--text:#e8e8e2;--text2:#a0a09a;--text3:#666660;}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:100%;margin:0 auto;padding:1.25rem 4rem 4rem}
.app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.app-title{font-size:18px;font-weight:600;display:flex;align-items:center;gap:6px}
.sync-status{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--surface2);border:0.5px solid var(--border);color:var(--text2);display:flex;align-items:center;gap:5px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#ccc;transition:background .3s}
.sync-dot.ok{background:var(--success)}.sync-dot.err{background:var(--danger)}.sync-dot.syncing{background:#BA7517;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.tabs{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--surface);color:var(--text2);cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:5px;transition:all .15s}
.tab:hover{background:var(--surface2)}.tab.active{background:var(--text);color:var(--bg);border-color:transparent}
/* Buttons */
.btn{padding:6px 13px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:all .15s}
.btn:hover{background:var(--surface2)}.btn.primary{background:var(--accent);color:#fff;border-color:transparent}.btn.primary:hover{opacity:.88}
.btn.success-btn{background:var(--success);color:#fff;border-color:transparent;font-size:11px;padding:3px 10px;border-radius:20px;flex-shrink:0}
.btn.export-btn{background:var(--accent);color:#fff;border-color:transparent}
.btn.sm{padding:3px 8px;font-size:12px}.btn.icon{padding:4px 7px;font-size:14px}
.btn.danger-txt{color:var(--danger);border-color:#f7c1c1}
/* Toolbar */
.toolbar{display:flex;gap:7px;margin-bottom:.6rem;align-items:center}
.toolbar input[type=text]{flex:1;height:34px;font-size:13px;padding:0 10px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--surface);color:var(--text);outline:none}
.sort-bar{display:flex;gap:8px;align-items:center;margin-bottom:.9rem;padding:7px 11px;background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);flex-wrap:wrap}
.sort-bar label{font-size:12px;color:var(--text3)}
.sort-bar select{font-size:12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:3px 7px;background:var(--bg);color:var(--text);cursor:pointer}
/* Group */
.group{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;margin-bottom:.65rem;box-shadow:var(--shadow);overflow:hidden}
.group-hdr{display:flex;align-items:center;gap:7px;padding:.65rem .9rem;user-select:none}
.group-hdr-click{display:flex;align-items:center;gap:7px;flex:1;cursor:pointer;min-width:0}
.group-title{font-size:18px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-badge{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--accent-bg);color:var(--accent-text);flex-shrink:0}
.tag-badge{font-size:11px;padding:2px 8px;border-radius:20px;background:#EEEDFE;color:#3C3489;font-weight:500;flex-shrink:0;white-space:nowrap}
.chevron{font-size:14px;color:var(--text3);transition:transform .2s;flex-shrink:0}.chevron.open{transform:rotate(180deg)}
.group-body{border-top:0.5px solid var(--border)}
/* Sub collapsed row */
.sub-collapsed{display:flex;align-items:center;gap:8px;padding:.4rem .9rem .4rem 2rem;border-bottom:0.5px solid var(--border);background:var(--surface2);cursor:pointer}
.sub-collapsed:last-child{border-bottom:none}
.sub-collapsed:hover{background:var(--bg)}
.sub-collapsed .sub-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sub-collapsed .sub-name{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-prog{height:3px;width:60px;border-radius:2px;background:var(--border-strong);overflow:hidden;flex-shrink:0}
.mini-prog-fill{height:100%;border-radius:2px}
.due-chip{font-size:10px;color:var(--text3);white-space:nowrap;flex-shrink:0}
.due-chip.overdue{color:var(--danger)}
/* Sub expanded */
.sub-exp{padding:.75rem .9rem .75rem 2rem;border-bottom:0.5px solid var(--border);background:var(--surface2)}
.sub-exp:last-child{border-bottom:none}
.sub-title-row{display:flex;align-items:center;gap:7px;margin-bottom:.5rem;flex-wrap:nowrap}
.sub-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sub-name{font-size:16px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;white-space:nowrap;flex-shrink:0}
.priority-badge{font-size:10px;padding:2px 6px;border-radius:20px;font-weight:500;white-space:nowrap;flex-shrink:0}
.prog-wrap{display:flex;align-items:center;gap:5px;width:160px;flex-shrink:0}
.prog-pct{font-size:11px;font-weight:500;color:var(--text2);width:28px;text-align:right;flex-shrink:0}
input[type=range].prog-slider{width:100px;flex-shrink:0;height:4px;cursor:pointer;border:none;background:none;display:block}
.sub-meta{display:flex;align-items:center;gap:10px;margin-bottom:.5rem;flex-wrap:wrap}
.sub-meta-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text3)}
.meta-fields{display:flex;flex-direction:column;gap:6px}
.meta-field label{font-size:11px;color:var(--text3);display:block;margin-bottom:2px}
.meta-field input[type=text],.meta-field textarea{width:100%;font-size:12px;border:0.5px solid var(--border);border-radius:var(--radius);padding:4px 7px;background:var(--bg);color:var(--text);font-family:inherit;outline:none}
.meta-field textarea{resize:none;height:46px}
.sub-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}
.flat-item{background:var(--surface);border:0.5px solid var(--border);border-radius:10px;margin-bottom:.5rem;padding:.75rem .9rem;box-shadow:var(--shadow)}
.flat-group-label{font-size:11px;color:var(--text3);margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* Priority/status */
.pri-high{background:#FAECE7;color:#993C1D}.pri-mid{background:#FAEEDA;color:#854F0B}.pri-low{background:#EAF3DE;color:#3B6D11}
.st-todo{background:var(--warning-bg);color:var(--warning-text)}.st-prog{background:var(--accent-bg);color:var(--accent-text)}.st-done{background:var(--success-bg);color:var(--success-text)}
/* More menu */
.more-btn{padding:3px 6px;border-radius:var(--radius);border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:15px;display:inline-flex;align-items:center;flex-shrink:0}
.more-btn:hover{background:var(--surface2)}
.more-menu-wrap{position:relative;flex-shrink:0}
.more-menu{position:absolute;right:0;top:110%;background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:50;min-width:110px;overflow:hidden}
.more-menu-item{padding:8px 13px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.more-menu-item:hover{background:var(--surface2)}.more-menu-item.danger{color:var(--danger)}
/* VIEW TAB */
.view-subtabs{display:flex;gap:5px;margin-bottom:.9rem}
.view-subtab{padding:5px 13px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--surface);color:var(--text2);cursor:pointer;font-size:12px;font-weight:500;transition:all .15s}
.view-subtab.active{background:var(--accent);color:#fff;border-color:transparent}
/* Calendar — full grid */
.cal-wrap{background:var(--surface);border:0.5px solid var(--border);border-radius:10px;margin-bottom:.9rem;overflow:hidden;box-shadow:var(--shadow)}
.cal-hdr{display:flex;align-items:center;gap:8px;padding:.6rem .9rem;border-bottom:0.5px solid var(--border)}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav span{font-size:14px;font-weight:500;min-width:100px;text-align:center}
.cal-grid-wrap{overflow-x:auto}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-left:0.5px solid var(--border);border-top:0.5px solid var(--border)}
.cal-day-hdr{font-size:11px;color:var(--text3);text-align:center;padding:5px 0;border-right:0.5px solid var(--border);border-bottom:0.5px solid var(--border);background:var(--surface2)}
.cal-cell{min-height:80px;border-right:0.5px solid var(--border);border-bottom:0.5px solid var(--border);padding:4px 5px;cursor:pointer;transition:background .1s;vertical-align:top;overflow:hidden}
.cal-cell:hover{background:var(--surface2)}
.cal-cell.selected{background:var(--accent-bg)}
.cal-cell.today .cal-cell-num{background:var(--accent);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.cal-cell.other-month .cal-cell-num{color:var(--text3)}
.cal-cell-num{font-size:11px;font-weight:500;margin-bottom:2px;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.cal-task-chip{display:flex;align-items:center;gap:3px;font-size:10px;padding:1px 4px;border-radius:3px;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:100%}
.cal-task-chip.due-chip{background:#FAECE7;color:#993C1D}
.cal-task-chip.sched-chip{background:var(--accent-bg);color:var(--accent-text)}
.cal-more{font-size:9px;color:var(--text3);padding:1px 3px}
.cal-tasks{border-top:0.5px solid var(--border);padding:.6rem .9rem;background:var(--surface2)}
.cal-tasks-title{font-size:11px;font-weight:500;color:var(--text2);margin-bottom:5px}
/* Matrix */
.matrix-outer{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quadrant{background:var(--surface);border:0.5px solid var(--border);border-radius:10px;padding:.7rem;min-height:120px;box-shadow:var(--shadow)}
.q-label{font-size:11px;font-weight:500;margin-bottom:.5rem}
.q-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px 3px 6px;border-radius:20px;margin:2px 2px 2px 0;border:0.5px solid var(--border);background:var(--surface2);cursor:grab;transition:background .1s;user-select:none}
.q-chip:hover{background:var(--accent-bg)}.q-chip.dragging{opacity:.5}
.q-chip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.q-drop-zone{min-height:60px;border-radius:6px;transition:background .15s;padding:4px}
.q-drop-zone.drag-over{background:var(--accent-bg);border:1.5px dashed var(--accent)}
/* Tag view */
.tag-section{background:var(--surface);border:0.5px solid var(--border);border-radius:10px;margin-bottom:.6rem;overflow:hidden;box-shadow:var(--shadow)}
.tag-section-hdr{display:flex;align-items:center;gap:8px;padding:.55rem .9rem;background:var(--surface2);border-bottom:0.5px solid var(--border)}
.tag-drop-zone{min-height:48px;padding:6px .9rem;transition:background .15s}
.tag-drop-zone.drag-over{background:var(--accent-bg)}
.tag-chip-item{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:6px;margin-bottom:3px;background:var(--surface2);border:0.5px solid var(--border);cursor:grab;user-select:none;transition:opacity .15s}
.tag-chip-item:hover{border-color:var(--border-strong)}.tag-chip-item.dragging{opacity:.4}
/* Accomplish */
.acc-toolbar{display:flex;justify-content:flex-end;align-items:center;margin-bottom:.9rem;gap:8px;flex-wrap:wrap}
.acc-group{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;margin-bottom:.65rem;box-shadow:var(--shadow);overflow:hidden}
.acc-group-hdr{display:flex;align-items:center;gap:8px;padding:.65rem .9rem;background:var(--surface2);border-bottom:0.5px solid var(--border)}
.acc-group-name{font-size:18px;font-weight:500;flex:1}
.acc-item{padding:.75rem .9rem .75rem 2rem;border-bottom:0.5px solid var(--border)}.acc-item:last-child{border-bottom:none}
.acc-item-row{display:flex;align-items:flex-start;gap:8px}
.acc-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.acc-info{flex:1;min-width:0}
.acc-name{font-size:16px;font-weight:500;margin-bottom:3px}
.acc-ts{font-size:12px;color:var(--text3);display:flex;gap:12px;flex-wrap:wrap;margin-bottom:5px}
.acc-note{font-size:12px;color:var(--text2);background:var(--surface2);border-radius:var(--radius);padding:5px 8px;border:0.5px solid var(--border);line-height:1.5}
/* Export */
.exp-section{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:1.1rem;margin-bottom:.9rem;box-shadow:var(--shadow)}
.exp-section h3{font-size:14px;font-weight:500;margin-bottom:.4rem;display:flex;align-items:center;gap:6px}
.exp-section p{font-size:12px;color:var(--text2);line-height:1.7;margin-bottom:.8rem}
.exp-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:7px}
.exp-row input{flex:1;min-width:0;height:34px;font-size:13px;padding:0 9px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--bg);color:var(--text);outline:none}
.gs-connected{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--success);font-weight:500}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:#1a1a18;color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;padding-top:50px;z-index:300}
.modal{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:1.35rem;width:440px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal h3{font-size:15px;font-weight:600;margin-bottom:.9rem}
.form-group{margin-bottom:.75rem}
.form-group label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px;font-weight:500}
.form-group input,.form-group select,.form-group textarea{width:100%;font-size:13px;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:7px 9px;background:var(--bg);color:var(--text);font-family:inherit;outline:none}
.form-group textarea{resize:vertical;height:60px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.color-picker{display:flex;gap:7px;flex-wrap:wrap;padding:3px 0}
.color-opt{width:22px;height:22px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color .15s}
.color-opt.sel{border-color:var(--text)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:.9rem}
.tag-chip-del-btn{cursor:pointer;font-size:14px;line-height:1;color:#6b67c0}.tag-chip-del-btn:hover{color:var(--danger)}
.tag-manage{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;min-height:28px}
.tm-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:20px;background:#EEEDFE;color:#3C3489;border:0.5px solid #c5c2f0}
.hidden{display:none}
.empty{text-align:center;padding:2.5rem;color:var(--text3);font-size:13px}
/* Note book tabs */
.note-book-tab{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:6px 6px 0 0;font-size:12px;border:0.5px solid var(--border);border-bottom:none;color:var(--text2);background:var(--surface2);cursor:pointer;white-space:nowrap;flex-shrink:0}
.note-book-tab.active{background:var(--surface);color:var(--text);font-weight:500}
.note-book-tab-add{display:inline-flex;align-items:center;padding:4px 9px;border-radius:6px 6px 0 0;font-size:13px;border:0.5px solid var(--border);border-bottom:none;color:var(--text3);background:var(--surface2);cursor:pointer;flex-shrink:0}
.note-book-tab-add:hover{color:var(--text)}
</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <span class="app-title"><i class="ti ti-clipboard-list" aria-hidden="true"></i>工項管理工具</span>
    <span class="sync-status" id="syncStatus"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">載入中...</span></span>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('list')"><i class="ti ti-list" aria-hidden="true"></i> 清單</button>
    <button class="tab" onclick="switchTab('view')"><i class="ti ti-layout-grid" aria-hidden="true"></i> 檢視</button>
    <button class="tab" onclick="switchTab('accomplish')"><i class="ti ti-circle-check" aria-hidden="true"></i> Accomplish <span id="accBadge" class="hidden" style="background:var(--success);color:#fff;border-radius:20px;padding:0 6px;font-size:11px;margin-left:2px"></span></button>
    <button class="tab" onclick="switchTab('export')"><i class="ti ti-settings" aria-hidden="true"></i> 設定與匯出</button>
  </div>

  <!-- LIST -->
  <div id="listView">
    <div class="toolbar">
      <button class="btn primary" onclick="openNewGroupModal()"><i class="ti ti-plus" aria-hidden="true"></i> 新增大項目</button>
      <button class="btn icon" onclick="toggleAllGroups(true)" title="全部展開"><i class="ti ti-chevrons-down" aria-hidden="true"></i></button>
      <button class="btn icon" onclick="toggleAllGroups(false)" title="全部折疊"><i class="ti ti-chevrons-up" aria-hidden="true"></i></button>
      <input type="text" id="searchBox" placeholder="搜尋工項..." oninput="renderList()">
    </div>
    <div class="sort-bar">
      <label>檢視：</label>
      <select id="viewMode" onchange="onViewModeChange()">
        <option value="group">依大項目分組</option>
        <option value="flat">小項目排序</option>
      </select>
      <label id="sortLabel" class="hidden">排序：</label>
      <select id="sortBy" class="hidden" onchange="renderList()">
        <option value="pri">優先度</option>
        <option value="urg">緊急度</option>
        <option value="imp">重要度</option>
        <option value="tag">標籤</option>
        <option value="due">截止日</option>
      </select>
      <label>標籤：</label>
      <select id="filterTag" onchange="renderList()"><option value="">全部</option></select>
    </div>
    <div id="listContainer"></div>
  </div>

  <!-- VIEW -->
  <div id="viewView" class="hidden">

    <!-- Row: sub-tabs + quick add -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem">
      <div class="view-subtabs">
        <button class="view-subtab active" id="stMatrix" onclick="switchSubView('matrix')">四象限</button>
        <button class="view-subtab" id="stTag" onclick="switchSubView('tag')">標籤</button>
      </div>
      <button class="btn sm primary" onclick="openQuickAddSub()"><i class="ti ti-plus" aria-hidden="true"></i> 快速新增</button>
    </div>

    <!-- Section A: Calendar (left) + Upcoming Events (right) — collapsible -->
    <div id="calSection" style="background:var(--surface);border:0.5px solid var(--border);border-radius:12px;margin-bottom:.75rem;overflow:hidden;box-shadow:var(--shadow)">
      <!-- Header -->
      <div style="display:flex;align-items:center;gap:8px;padding:.6rem .9rem;border-bottom:0.5px solid var(--border);background:var(--surface2)">
        <i class="ti ti-calendar" aria-hidden="true" style="color:var(--text3)"></i>
        <button class="btn icon sm" onclick="calMove(-1)"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
        <span id="calNavLabel" style="font-size:13px;font-weight:500;min-width:90px;text-align:center"></span>
        <button class="btn icon sm" onclick="calMove(1)"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
        <button class="btn sm" onclick="clearCalSel()" style="font-size:11px">清除選取</button>

          <input type="file" accept=".ics" id="icsFileInput" style="display:none" onchange="importIcs(this)">
        </label>
        <button class="btn icon sm" id="calCollapseBtn" onclick="toggleCalSection()" title="收合"><i class="ti ti-chevron-up" aria-hidden="true"></i></button>
      </div>
      <!-- Body: cal left, events right — same width as pomo panel -->
      <div id="calBody" style="display:grid;grid-template-columns:1fr 300px;gap:0">
        <!-- Calendar grid -->
        <div style="padding:.75rem .9rem;border-right:0.5px solid var(--border)">

            <div style="font-size:12px;color:var(--text3);text-align:center;padding:1.5rem 0">

    <!-- Section B: Tasks (left) + Pomo/Note (right) -->
    <div style="display:grid;grid-template-columns:1fr 300px;gap:.75rem">

      <!-- Left: matrix or tag -->
      <div>
        <div id="matrixView2">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:10px;color:var(--text3);margin-bottom:4px;text-align:center">
            <div>← 不緊急</div><div>緊急 →</div>
          </div>
          <div class="matrix-outer">
            <div class="quadrant"><div class="q-label"><span style="background:#EEEDFE;color:#3C3489;padding:1px 7px;border-radius:10px">II 重要・不緊急</span></div><div class="q-drop-zone" id="qz-II" ondragover="onQDragOver(event,'II')" ondragleave="onQDragLeave(event,'II')" ondrop="onQDrop(event,'II')"><div id="qc-II"></div></div></div>
            <div class="quadrant"><div class="q-label"><span style="background:#FAECE7;color:#993C1D;padding:1px 7px;border-radius:10px">I 重要・緊急</span></div><div class="q-drop-zone" id="qz-I" ondragover="onQDragOver(event,'I')" ondragleave="onQDragLeave(event,'I')" ondrop="onQDrop(event,'I')"><div id="qc-I"></div></div></div>
            <div class="quadrant"><div class="q-label"><span style="background:#F1EFE8;color:#5F5E5A;padding:1px 7px;border-radius:10px">III 不重要・不緊急</span></div><div class="q-drop-zone" id="qz-III" ondragover="onQDragOver(event,'III')" ondragleave="onQDragLeave(event,'III')" ondrop="onQDrop(event,'III')"><div id="qc-III"></div></div></div>
            <div class="quadrant"><div class="q-label"><span style="background:#FAEEDA;color:#854F0B;padding:1px 7px;border-radius:10px">IV 不重要・緊急</span></div><div class="q-drop-zone" id="qz-IV" ondragover="onQDragOver(event,'IV')" ondragleave="onQDragLeave(event,'IV')" ondrop="onQDrop(event,'IV')"><div id="qc-IV"></div></div></div>
          </div>
        </div>
        <div id="tagView2" class="hidden"></div>
      </div>

      <!-- Right: Pomodoro / Note panel -->
      <div style="background:var(--surface);border:0.5px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)">
        <!-- Tab switcher -->
        <div style="display:flex;border-bottom:0.5px solid var(--border);background:var(--surface2)">
          <button id="pomoTab" onclick="switchMultiPanel('pomo')" style="flex:1;padding:8px;font-size:12px;font-weight:500;border:none;border-bottom:2px solid var(--text);background:transparent;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px"><i class="ti ti-clock" aria-hidden="true"></i> 蕃茄鐘</button>
          <button id="noteTab" onclick="switchMultiPanel('note')" style="flex:1;padding:8px;font-size:12px;font-weight:500;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px"><i class="ti ti-notes" aria-hidden="true"></i> 筆記</button>
        </div>

        <!-- Pomodoro panel -->
        <div id="pomoPanel">
          <div id="pomoWrap" style="background:#D95550;padding:20px 16px 22px;text-align:center">
            <div style="display:flex;justify-content:center;gap:3px;margin-bottom:14px">
              <button onclick="setPomoMode('pomo')" id="pmPomo" style="font-size:11px;padding:4px 11px;border-radius:4px;background:rgba(0,0,0,.2);color:#fff;font-weight:600;border:none;cursor:pointer">Pomodoro</button>
              <button onclick="setPomoMode('short')" id="pmShort" style="font-size:11px;padding:4px 11px;border-radius:4px;background:transparent;color:rgba(255,255,255,.75);border:none;cursor:pointer">Short Break</button>
              <button onclick="setPomoMode('long')" id="pmLong" style="font-size:11px;padding:4px 11px;border-radius:4px;background:transparent;color:rgba(255,255,255,.75);border:none;cursor:pointer">Long Break</button>
            </div>
            <div style="background:rgba(255,255,255,.15);border-radius:8px;padding:18px 16px 16px">
              <div id="pomoDisplay" onclick="startEditPomo()" title="點擊直接編輯時間"
                style="font-size:56px;font-weight:700;color:#fff;letter-spacing:-2px;line-height:1;margin-bottom:16px;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">25:00</div>
              <button onclick="togglePomo()" id="pomoStartBtn"
                style="width:100%;padding:9px 0;border-radius:4px;font-size:14px;font-weight:700;border:none;cursor:pointer;background:#fff;color:#D95550;letter-spacing:2px">START</button>
            </div>
          </div>
        </div>

        <!-- Note panel (hidden by default) -->
        <div id="notePanel" style="display:none;flex-direction:column;height:100%">
          <!-- Note book tabs -->
          <div id="noteTabBar" style="display:flex;align-items:center;padding:6px 8px 0;gap:0;border-bottom:0.5px solid var(--border);background:var(--surface2);overflow-x:auto"></div>
          <!-- Note content area -->
          <textarea id="noteContent" style="flex:1;width:100%;min-height:280px;border:none;outline:none;resize:none;padding:.75rem .9rem;font-size:13px;font-family:inherit;background:var(--surface);color:var(--text);line-height:1.7" placeholder="在此輸入筆記..."></textarea>
        </div>

      </div>
    </div>
  </div>

  <!-- ACCOMPLISH -->
  <div id="accomplishView" class="hidden">
    <div class="acc-toolbar">
      <label style="font-size:12px;color:var(--text2)">標籤：</label>
      <select id="accFilterTag" onchange="renderAccomplish()" style="font-size:12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:4px 8px;background:var(--bg);color:var(--text)"><option value="">全部</option></select>
      <label style="font-size:12px;color:var(--text2)">排序：</label>
      <select id="accSort" onchange="renderAccomplish()" style="font-size:12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:4px 8px;background:var(--bg);color:var(--text)">
        <option value="created">建立時間</option><option value="done">完成時間</option>
      </select>
    </div>
    <div id="accomplishContainer"></div>
  </div>

  <!-- EXPORT -->
  <div id="exportView" class="hidden">
    <div class="exp-section">
      <h3><i class="ti ti-brand-google" aria-hidden="true"></i> Google Sheets 即時同步</h3>
      <p>每次新增、編輯、完成工項時自動同步至 Google Sheets。</p>
      <div id="gsFormArea">
        <div class="exp-row">
          <input type="text" id="scriptUrlInput" placeholder="貼上 Apps Script 網址">
          <button class="btn primary" onclick="saveScriptUrl()"><i class="ti ti-plug" aria-hidden="true"></i> 連接</button>
        </div>
      </div>
      <div id="gsConnected" class="hidden">
        <span class="gs-connected"><i class="ti ti-circle-check" aria-hidden="true"></i> 已連接 Google Sheets</span>
        <button class="btn sm" style="margin-left:10px" onclick="disconnectGSheet()">中斷連接</button>
        <div style="font-size:11px;color:var(--text3);margin-top:6px" id="gsSyncLog"></div>

    </div>
    <div class="exp-section">
      <h3><i class="ti ti-download" aria-hidden="true"></i> 匯出資料</h3>
      <p>將所有工項與已完成紀錄打包匯出。JSON 可直接貼給 Claude 生成報表；CSV 可用 Excel 開啟。</p>

        <button class="btn export-btn" onclick="exportCSV()"><i class="ti ti-table" aria-hidden="true"></i> 匯出 CSV</button>

<!-- GROUP MODAL -->
<div class="modal-bg hidden" id="groupModal" onclick="if(event.target===this)this.classList.add('hidden')">

  <div class="modal" onclick="event.stopPropagation()">
    <h3>管理標籤</h3>
    <div class="tag-manage" id="tagList"></div>

      <input type="text" id="newTagInput" placeholder="新增標籤..." style="flex:1;font-size:13px;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:6px 8px;background:var(--bg);color:var(--text)">
      <button class="btn primary" onclick="addTag()"><i class="ti ti-plus" aria-hidden="true"></i></button>
    </div>
    <div class="modal-btns"><button class="btn" onclick="document.getElementById('tagModal').classList.add('hidden')">完成</button></div>

<script>
const COLORS=['#D85A30','#1D9E75','#378ADD','#D4537E','#7F77DD','#BA7517','#639922','#888780'];
const LS_DATA='taskmanager_data_v2';
const LS_GS='taskmanager_gs_url';
const LS_TAGS='taskmanager_tags';
const DEFAULT_TAGS=['面談','招募/錄取','入職','離職','其他'];
const DEFAULT_SCRIPT_URL='https://script.google.com/macros/s/AKfycbxgHAx_DjHoivLJfC7LOyWitAHfhiWwjQ_umymFqqexFWYUxDWZjEGhJw1x_VM0H3c6nw/exec';

let data={groups:[],accomplished:[]};
let scriptUrl='';
let tags=[...DEFAULT_TAGS];
let _ngColor=COLORS[0],_nsColor=COLORS[0];
let _db={};
let _expandedSubs={};
let _calOpen=false;
let _calYear=new Date().getFullYear();
let _calMonth=new Date().getMonth();
let _calSel=null;
let _curSubView='matrix';
let _dragItem=null;

function save(){try{localStorage.setItem(LS_DATA,JSON.stringify(data));}catch(e){}}
function load(){try{const d=localStorage.getItem(LS_DATA);if(d)data=JSON.parse(d);}catch(e){}}
function loadGS(){try{const u=localStorage.getItem(LS_GS);scriptUrl=u||DEFAULT_SCRIPT_URL;if(!u)localStorage.setItem(LS_GS,DEFAULT_SCRIPT_URL);}catch(e){scriptUrl=DEFAULT_SCRIPT_URL;}}
function loadTags(){try{const t=localStorage.getItem(LS_TAGS);if(t)tags=JSON.parse(t);}catch(e){}}
function saveTags(){try{localStorage.setItem(LS_TAGS,JSON.stringify(tags));}catch(e){}}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function fmtTs(ts){if(!ts)return'—';const d=new Date(ts);return d.toLocaleDateString('zh-TW')+' '+d.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}
function fmtDate(str){if(!str)return'';const[y,m,d]=str.split('-');return`${y}/${m}/${d}`}
function toLocal(ts){if(!ts)return'';const d=new Date(ts);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function toDateStr(ts){if(!ts)return'';return new Date(ts).toISOString().slice(0,10)}
function getYear(ts){return ts?new Date(ts).getFullYear():new Date().getFullYear()}
function statusLabel(p){return p===0?'待辦':p===100?'完成':'進行中'}
function statusClass(p){return p===0?'st-todo':p===100?'st-done':'st-prog'}
function priLabel(p){return p==='high'?'高':p==='mid'?'中':'低'}
function priClass(p){return p==='high'?'pri-high':p==='mid'?'pri-mid':'pri-low'}
function quadrant(urg,imp){if(imp==='high'&&urg==='urgent')return'I';if(imp==='high'&&urg==='normal')return'II';if(imp==='low'&&urg==='normal')return'III';return'IV'}
function priOrder(p){return p==='high'?0:p==='mid'?1:2}
function urgOrder(u){return u==='urgent'?0:1}
function impOrder(i){return i==='high'?0:1}
function sortGroups(){data.groups.sort((a,b)=>priOrder(a.pri)-priOrder(b.pri))}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function isOverdue(s){if(!s.due||s.prog===100)return false;return new Date(s.due)<new Date(new Date().toDateString())}

function showToast(msg,color){const t=document.getElementById('toast');t.textContent=msg;t.style.background=color||'#1a1a18';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
function setSyncStatus(state,label){const dot=document.getElementById('syncDot');dot.className='sync-dot'+(state==='ok'?' ok':state==='err'?' err':state==='syncing'?' syncing':'');document.getElementById('syncLabel').textContent=label;}
function setSyncLog(msg){const el=document.getElementById('gsSyncLog');if(el)el.textContent=msg;}

function buildColorPicker(cid,sel,cb){
  const cp=document.getElementById(cid);
  cp.innerHTML=COLORS.map(c=>`<div class="color-opt${c===sel?' sel':''}" style="background:${c}" data-c="${c}"></div>`).join('');
  cp.querySelectorAll('.color-opt').forEach(el=>el.onclick=()=>{cp.querySelectorAll('.color-opt').forEach(e=>e.classList.remove('sel'));el.classList.add('sel');cb(el.dataset.c)});
}

/* TAGS */
function buildTagSelect(selId,selectedVal,includeNone=true){
  const sel=document.getElementById(selId);if(!sel)return;
  const opts=includeNone?'<option value="">— 無（歸入其他）—</option>':'<option value="">全部</option>';
  sel.innerHTML=opts+tags.map(t=>`<option value="${esc(t)}"${t===selectedVal?' selected':''}>${esc(t)}</option>`).join('');
}
function buildFilterTag(){
  ['filterTag','accFilterTag'].forEach(id=>{
    const sel=document.getElementById(id);if(!sel)return;
    const cur=sel.value;
    sel.innerHTML='<option value="">全部</option>'+tags.map(t=>`<option value="${esc(t)}"${t===cur?' selected':''}>${esc(t)}</option>`).join('');
  });
}
function buildGidSelect(selId,selectedGid){
  const sel=document.getElementById(selId);if(!sel)return;
  sel.innerHTML=data.groups.map(g=>`<option value="${g.id}"${g.id===selectedGid?' selected':''}>${esc(g.name)}</option>`).join('');
}
function openTagManager(){renderTagList();document.getElementById('tagModal').classList.remove('hidden');}
function renderTagList(){
  document.getElementById('tagList').innerHTML=tags.length
    ?tags.map((t,i)=>`<span class="tm-chip">${esc(t)}<span class="tag-chip-del-btn" onclick="deleteTag(${i})">×</span></span>`).join('')
    :'<span style="font-size:12px;color:var(--text3)">尚無標籤</span>';
}
function addTag(){
  const inp=document.getElementById('newTagInput');const val=inp.value.trim();
  if(!val||tags.includes(val)){showToast('標籤已存在或名稱為空','#BA7517');return}
  tags.push(val);saveTags();inp.value='';renderTagList();buildFilterTag();
}
function deleteTag(i){tags.splice(i,1);saveTags();renderTagList();buildFilterTag();}

/* TABS */
function switchTab(t){
  ['list','view','accomplish','export'].forEach(v=>document.getElementById(v+'View').classList.toggle('hidden',v!==t));
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',['list','view','accomplish','export'][i]===t));
  closeAllMoreMenus();
  if(t==='view'){renderCal();renderSubView();updatePomoDisplay();updatePomoModeButtons();}
  if(t==='accomplish')renderAccomplish();
  if(t==='export')renderExportPage();
}

/* VIEW SUBTABS */
function switchSubView(v){
  _curSubView=v;
  document.getElementById('stMatrix').classList.toggle('active',v==='matrix');
  document.getElementById('stTag').classList.toggle('active',v==='tag');
  document.getElementById('matrixView2').classList.toggle('hidden',v!=='matrix');
  document.getElementById('tagView2').classList.toggle('hidden',v!=='tag');
  renderSubView();
}
function renderSubView(){
  if(_curSubView==='matrix')renderMatrix();
  else renderTagView();
}

/* VIEW MODE */
function onViewModeChange(){
  const isFlat=document.getElementById('viewMode').value==='flat';
  document.getElementById('sortLabel').classList.toggle('hidden',!isFlat);
  document.getElementById('sortBy').classList.toggle('hidden',!isFlat);
  renderList();
}

/* COLLAPSE ALL */
function toggleAllGroups(open){data.groups.forEach(g=>g.open=open);save();renderList();}

/* MORE MENU */
function closeAllMoreMenus(){document.querySelectorAll('.more-menu').forEach(m=>m.remove());}
function toggleMoreMenu(gid,btn){
  closeAllMoreMenus();
  const menu=document.createElement('div');
  menu.className='more-menu';
  menu.innerHTML=`<div class="more-menu-item" onclick="openEditGroupModal('${gid}')"><i class="ti ti-pencil" aria-hidden="true"></i> 編輯</div><div class="more-menu-item danger" onclick="confirmDeleteGroup('${gid}')"><i class="ti ti-trash" aria-hidden="true"></i> 刪除</div>`;
  btn.closest('.more-menu-wrap').appendChild(menu);
  setTimeout(()=>document.addEventListener('click',function h(e){if(!menu.contains(e.target)&&e.target!==btn){menu.remove();document.removeEventListener('click',h);}},{once:false}),10);
}

/* GROUP MODAL */
function openNewGroupModal(){
  document.getElementById('groupModalTitle').textContent='新增大項目';
  ['ngName'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('ngUrg').value='normal';
  document.getElementById('ngImp').value='low';
  document.getElementById('ngPri').value='mid';
  document.getElementById('ngEditId').value='';

function saveSub(){
  const name=document.getElementById('nsName').value.trim();if(!name)return;
  const newGid=document.getElementById('nsGid').value;
  const editId=document.getElementById('nsEditId').value;
  const prog=+document.getElementById('nsProgress').value;
  const payload={name,pri:document.getElementById('nsPri').value,color:_nsColor,prog,ref:document.getElementById('nsRef').value,note:document.getElementById('nsNote').value,schedule:document.getElementById('nsSchedule').value,due:document.getElementById('nsDue').value,tag:document.getElementById('nsTag').value};

  if(editId){
    // find in which group
    let oldGid=null;
    data.groups.forEach(g=>{if(g.subs.find(x=>x.id===editId))oldGid=g.id;});
    if(oldGid){
      const og=data.groups.find(x=>x.id===oldGid);
      const si=og.subs.findIndex(x=>x.id===editId);
      if(si>=0){
        const existing=og.subs[si];
        if(oldGid!==newGid){
          og.subs.splice(si,1);
          const ng=data.groups.find(x=>x.id===newGid);
          if(ng){const updated={...existing,...payload};ng.subs.push(updated);ng.subs.sort((a,b)=>priOrder(a.pri)-priOrder(b.pri));syncRow(updated,ng,false);}
        } else {
          Object.assign(existing,payload);og.subs.sort((a,b)=>priOrder(a.pri)-priOrder(b.pri));syncRow(existing,og,false);
        }
      }
    }
  } else {
    const g=data.groups.find(x=>x.id===newGid);
    if(g){const sub={id:uid(),createdAt:Date.now(),...payload};g.subs.push(sub);g.subs.sort((a,b)=>priOrder(a.pri)-priOrder(b.pri));syncRow(sub,g,false);}
  }
  save();document.getElementById('subModal').classList.add('hidden');renderList();
  if(_curSubView)renderSubView();
}
function deleteSub(gid,sid){
  if(!confirm('確定刪除此小項目？'))return;
  const g=data.groups.find(x=>x.id===gid);if(!g)return;
  g.subs=g.subs.filter(x=>x.id!==sid);save();renderList();showToast('小項目已刪除');
}

  const s=g.subs[si];
  const acc={...s,groupId:gid,groupName:g.name,groupColor:g.color,doneAt:Date.now()};
  data.accomplished.push(acc);g.subs.splice(si,1);

}

/* RENDER LIST */
function renderList(){
  const q=(document.getElementById('searchBox')||{}).value?.toLowerCase()||'';
  const filterTag=document.getElementById('filterTag').value;
  const viewMode=document.getElementById('viewMode').value;
  const c=document.getElementById('listContainer');
  closeAllMoreMenus();

  if(viewMode==='flat'){
    const sortBy=document.getElementById('sortBy').value;
    let allSubs=[];
    data.groups.forEach(g=>{
      g.subs.forEach(s=>{
        if(filterTag&&(s.tag||'其他')!==filterTag&&s.tag!==filterTag)return;
        if(q&&!s.name.toLowerCase().includes(q)&&!g.name.toLowerCase().includes(q))return;
        allSubs.push({s,g});
      });
    });
    allSubs.sort((a,b)=>{
      if(sortBy==='pri')return priOrder(a.s.pri)-priOrder(b.s.pri);
      if(sortBy==='urg')return urgOrder(a.g.urg)-urgOrder(b.g.urg);
      if(sortBy==='imp')return impOrder(a.g.imp)-impOrder(b.g.imp);
      if(sortBy==='tag')return(a.s.tag||'其他').localeCompare(b.s.tag||'其他');
      if(sortBy==='due'){const da=a.s.due||'9999';const db=b.s.due||'9999';return da.localeCompare(db);}
      return 0;
    });
    if(!allSubs.length){c.innerHTML='<div class="empty">尚無符合的工項</div>';return}
    c.innerHTML=allSubs.map(({s,g})=>`<div class="flat-item">${subExpandedHtml(s,g.id)}
<div class="flat-group-label">
  <span>所屬：</span>
  <span style="display:inline-flex;align-items:center;gap:4px"><span style="width:7px;height:7px;border-radius:50%;background:${g.color};display:inline-block"></span>${esc(g.name)}</span>
  ${s.tag?`<span class="tag-badge">${esc(s.tag)}</span>`:``}
</div></div>`).join('');
  } else {
    const visible=data.groups.filter(g=>{
      if(filterTag&&!g.subs.some(s=>(s.tag||'其他')===filterTag||s.tag===filterTag))return !filterTag;
      return !q||g.name.toLowerCase().includes(q)||g.subs.some(s=>s.name.toLowerCase().includes(q));
    });
    if(!visible.length){c.innerHTML='<div class="empty">尚無工項，按「新增大項目」開始</div>';return}
    c.innerHTML=visible.map(g=>{
      const isOpen=g.open!==false;
      const filtered=q?g.subs.filter(s=>s.name.toLowerCase().includes(q)||g.name.toLowerCase().includes(q)):g.subs;
      const fTag=filterTag?filtered.filter(s=>(s.tag||'其他')===filterTag||s.tag===filterTag):filtered;
      return`<div class="group">
<div class="group-hdr">
  <div class="group-hdr-click" onclick="toggleGroup('${g.id}')">
    <span style="width:9px;height:9px;border-radius:50%;background:${g.color};flex-shrink:0;display:inline-block"></span>
    <span class="group-title">${esc(g.name)}</span>
    <span class="priority-badge ${priClass(g.pri)}">${priLabel(g.pri)}</span>
    <span class="group-badge">${fTag.length}</span>
    <i class="ti ti-chevron-down chevron${isOpen?' open':''}" aria-hidden="true"></i>
  </div>
  <div class="more-menu-wrap">
    <button class="more-btn" onclick="toggleMoreMenu('${g.id}',this)"><i class="ti ti-dots-vertical" aria-hidden="true"></i></button>
  </div>
</div>
${isOpen?`<div class="group-body">
${fTag.map(s=>subRowHtml(s,g.id)).join('')}
<div style="padding:.45rem .9rem">
  <button class="btn sm" onclick="openNewSubModal('${g.id}')"><i class="ti ti-plus" aria-hidden="true"></i> 新增小項目</button>
</div>
</div>`:''}
</div>`;
    }).join('');
  }
}

function toggleCal(){} // kept for compat
function calMove(dir){_calMonth+=dir;if(_calMonth>11){_calMonth=0;_calYear++;}if(_calMonth<0){_calMonth=11;_calYear--;}renderCal();}
function clearCalSel(){_calSel=null;document.getElementById('calSelLabel').textContent='';renderCal();renderSubView();}
function renderCal(){
  const months=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('calNavLabel').textContent=`${_calYear} 年 ${months[_calMonth]}`;
  const today=new Date();
  const todayStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const firstDay=new Date(_calYear,_calMonth,1).getDay();
  const daysInMonth=new Date(_calYear,_calMonth+1,0).getDate();
  const prevDays=new Date(_calYear,_calMonth,0).getDate();

  // build task map: date -> [{s,g,type}]
  const taskMap={};
  data.groups.forEach(g=>g.subs.forEach(s=>{
    if(s.due)taskMap[s.due]=[...(taskMap[s.due]||[]),{s,g,type:'due'}];
    if(s.schedule&&s.schedule!==s.due)taskMap[s.schedule]=[...(taskMap[s.schedule]||[]),{s,g,type:'sched'}];
  }));

  const grid=document.getElementById('calGrid');
  grid.innerHTML=['日','一','二','三','四','五','六'].map(d=>`<div class="cal-day-hdr">${d}</div>`).join('');

  // prev month padding
  for(let i=firstDay-1;i>=0;i--){
    const d=prevDays-i;
    grid.innerHTML+=`<div class="cal-cell other-month"><div class="cal-cell-num">${d}</div></div>`;
  }
  // current month
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${_calYear}-${String(_calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=dateStr===todayStr;
    const isSel=_calSel===dateStr;
    const tasks=taskMap[dateStr]||[];
    const show=tasks.slice(0,3);
    const more=tasks.length-show.length;
    const chips=show.map(({s,type})=>`<div class="cal-task-chip ${type==='due'?'due-chip':'sched-chip'}" onclick="event.stopPropagation();openEditSubModal('${s.groupId||_findGid(s.id)}','${s.id}')">
<span style="width:5px;height:5px;border-radius:50%;background:${s.color};flex-shrink:0;display:inline-block"></span>
<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.name)}</span>
</div>`).join('');
    grid.innerHTML+=`<div class="cal-cell${isToday?' today':''}${isSel?' selected':''}" onclick="calSelect('${dateStr}')">
<div class="cal-cell-num">${d}</div>
${chips}
${more>0?`<div class="cal-more">+${more} 項</div>`:''}
</div>`;
  }
  // next month padding
  const total=firstDay+daysInMonth;
  const remaining=(7-total%7)%7;
  for(let d=1;d<=remaining;d++){
    grid.innerHTML+=`<div class="cal-cell other-month"><div class="cal-cell-num">${d}</div></div>`;
  }
  renderCalTasks();
}

const Q_URG={I:'urgent',II:'normal',III:'normal',IV:'urgent'};
const Q_IMP={I:'high',II:'high',III:'low',IV:'low'};

function onQDragStart(e,gid,sid,fromQ,fromIdx){
  _dragItem={type:'matrix',gid,sid,fromQ,fromIdx};
  e.dataTransfer.effectAllowed='move';
  setTimeout(()=>{const el=document.getElementById(`qchip_${gid}_${sid}`);if(el)el.classList.add('dragging');},0);
}
function onQDragEnd(e){
  document.querySelectorAll('.q-chip.dragging').forEach(el=>el.classList.remove('dragging'));
  document.querySelectorAll('.q-drop-zone.drag-over').forEach(el=>el.classList.remove('drag-over'));
  _dragItem=null;
}
function onQDragOver(e,q){e.preventDefault();document.getElementById('qz-'+q).classList.add('drag-over');}
function onQDragLeave(e,q){document.getElementById('qz-'+q).classList.remove('drag-over');}
function onQDrop(e,toQ){
  e.preventDefault();
  document.getElementById('qz-'+toQ).classList.remove('drag-over');
  if(!_dragItem)return;
  const {gid,sid,fromQ}=_dragItem;
  if(sid){
    const g=data.groups.find(x=>x.id===gid);if(!g)return;
    const s=g.subs.find(x=>x.id===sid);if(!s)return;
    if(fromQ===toQ){
      // reorder within zone — move to end
      const idx=g.subs.findIndex(x=>x.id===sid);
      if(idx>=0){g.subs.splice(idx,1);g.subs.push(s);}
    } else {
      // update group urg/imp based on target quadrant
      g.urg=Q_URG[toQ];g.imp=Q_IMP[toQ];
    }
    save();syncRow(s,g,false);
  } else {
    // group chip
    const g=data.groups.find(x=>x.id===gid);if(!g)return;
    g.urg=Q_URG[toQ];g.imp=Q_IMP[toQ];
    save();
  }
  renderMatrix();
}

function onTagDragEnd(){
  document.querySelectorAll('.tag-chip-item.dragging').forEach(el=>el.classList.remove('dragging'));
  document.querySelectorAll('.tag-drop-zone.drag-over').forEach(el=>el.classList.remove('drag-over'));

function onTagDragOver(e,tag){e.preventDefault();document.getElementById('tdz-'+tag)?.classList.add('drag-over');}
function onTagDragLeave(e,tag){document.getElementById('tdz-'+tag)?.classList.remove('drag-over');}
function onTagDrop(e,toTag){
  e.preventDefault();
  document.getElementById('tdz-'+toTag)?.classList.remove('drag-over');
  if(!_dragItem)return;
  const {gid,sid,fromTag}=_dragItem;
  const g=data.groups.find(x=>x.id===gid);if(!g)return;
  const s=g.subs.find(x=>x.id===sid);if(!s)return;
  const actualTag=toTag==='其他'?'':toTag;
  s.tag=actualTag;
  if(fromTag!==toTag){
    // reorder: move to end of new tag group (handled by re-render)
  } else {
    // same tag, reorder priority: move dragged item up
    const idx=g.subs.findIndex(x=>x.id===sid);
    if(idx>0){g.subs.splice(idx,1);g.subs.unshift(s);}
  }
  save();syncRow(s,g,false);renderTagView();
}

function rowFromItem(s,g,isDone){

const POMO_DEFAULTS={pomo:25,short:5,long:15};
let _pomoTimes={...POMO_DEFAULTS};
let _pomoMode='pomo';
let _pomoSecs=25*60;

let _pomoEditing=false;

function setPomoMode(m){
  _pomoMode=m;

function updatePomoWrapColor(){
  const colors={pomo:'#D95550',short:'#38858A',long:'#285d61'};

  const w=document.getElementById('pomoWrap');if(w)w.style.background=c;
  const sb=document.getElementById('pomoStartBtn');if(sb)sb.style.color=c;

function updatePomoDisplay(){
  const m=Math.floor(_pomoSecs/60);const s=_pomoSecs%60;
  const el=document.getElementById('pomoDisplay');
  if(el&&!_pomoEditing)el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function togglePomo(){
  if(_pomoEditing)return;
  if(_pomoRunning){
    clearInterval(_pomoTimer);_pomoRunning=false;
    document.getElementById('pomoStartBtn').textContent='START';
  } else {
    _pomoRunning=true;
    document.getElementById('pomoStartBtn').textContent='PAUSE';
    _pomoTimer=setInterval(()=>{
      if(_pomoSecs>0){_pomoSecs--;updatePomoDisplay();}
      else{clearInterval(_pomoTimer);_pomoRunning=false;document.getElementById('pomoStartBtn').textContent='START';try{new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAA==').play();}catch(e){}showToast('時間到！');}
    },1000);
  }
}
function startEditPomo(){
  if(_pomoRunning)return;
  _pomoEditing=true;
  const m=Math.floor(_pomoSecs/60);const s=_pomoSecs%60;
  const el=document.getElementById('pomoDisplay');
  const inp=document.createElement('input');
  inp.type='text';inp.value=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  inp.style.cssText='font-size:56px;font-weight:700;color:#fff;background:transparent;border:none;border-bottom:2px solid rgba(255,255,255,.5);outline:none;width:160px;text-align:center;letter-spacing:-2px;font-family:inherit';
  el.replaceWith(inp);inp.focus();inp.select();
  function commit(){
    _pomoEditing=false;
    const parts=inp.value.split(':');
    const nm=parseInt(parts[0])||0;const ns=parseInt(parts[1])||0;
    _pomoSecs=Math.min(nm,99)*60+Math.min(ns,59);
    _pomoTimes[_pomoMode]=Math.floor(_pomoSecs/60);
    const div=document.createElement('div');
    div.id='pomoDisplay';div.onclick=startEditPomo;div.title='點擊直接編輯時間';
    div.style.cssText='font-size:56px;font-weight:700;color:#fff;letter-spacing:-2px;line-height:1;margin-bottom:16px;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
    inp.replaceWith(div);updatePomoDisplay();
  }
  inp.onblur=commit;inp.onkeydown=e=>{if(e.key==='Enter')commit();if(e.key==='Escape'){_pomoEditing=false;inp.replaceWith(document.getElementById('pomoDisplay')||inp);updatePomoDisplay();}};
}

/* ── ICS IMPORT ── */
function importIcs(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const text=e.target.result;
    const events=parseIcs(text);
    renderUpcomingEvents(events);
    showToast(`匯入 ${events.length} 個活動 ✓`);
    input.value='';
  };
  reader.readAsText(file);
}
function parseIcs(text){
  const events=[];const lines=text.replace(/\r\n|\r/g,'\n').replace(/\n[ \t]/g,'').split('\n');
  let cur=null;
  lines.forEach(l=>{
    if(l==='BEGIN:VEVENT'){cur={};}
    else if(l==='END:VEVENT'&&cur){events.push(cur);cur=null;}
    else if(cur){
      const ci=l.indexOf(':');if(ci<0)return;
      const key=l.slice(0,ci).split(';')[0];const val=l.slice(ci+1);
      if(key==='SUMMARY')cur.title=val.replace(/\\,/g,',').replace(/\\n/g,' ');
      if(key==='DTSTART'||key==='DTSTART;VALUE=DATE')cur.start=val;
      if(key==='DTEND'||key==='DTEND;VALUE=DATE')cur.end=val;
      if(key==='DESCRIPTION')cur.desc=val.replace(/\\n/g,' ').replace(/\\,/g,',').slice(0,80);
    }
  });
  return events.sort((a,b)=>(a.start||'').localeCompare(b.start||'')).slice(0,20);
}
function icsDateToDisplay(str){
  if(!str)return'';
  const s=str.replace(/[TZ]/g,'');
  if(s.length>=8){const y=s.slice(0,4),m=s.slice(4,6),d=s.slice(6,8);
    const hr=s.slice(8,10),mn=s.slice(10,12);
    return hr?`${y}/${m}/${d} ${hr}:${mn}`:`${y}/${m}/${d}`;}
  return str;
}
function renderUpcomingEvents(events){
  const el=document.getElementById('upcomingEventsList');if(!el)return;
  if(!events.length){el.innerHTML='<div style="font-size:12px;color:var(--text3);text-align:center;padding:1.5rem 0">無即將到來的活動</div>';return;}
  const colors=['#378ADD','#D85A30','#1D9E75','#7F77DD','#D4537E','#BA7517'];
  el.innerHTML=events.map((ev,i)=>`<div style="display:flex;align-items:stretch;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--border)">
<div style="width:3px;border-radius:2px;background:${colors[i%colors.length]};flex-shrink:0"></div>
<div style="flex:1;min-width:0">
  <div style="font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(ev.title||'（無標題）')}</div>
  <div style="font-size:11px;color:var(--text3);margin-top:1px">${icsDateToDisplay(ev.start)}</div>
  ${ev.desc?`<div style="font-size:11px;color:var(--text2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(ev.desc)}</div>`:''}
</div>
</div>`).join('');
}

// INIT
load();loadGS();loadTags();loadNotes();
buildFilterTag();
updateAccBadge();
renderList();
if(scriptUrl){setSyncStatus('ok','已連接 Google Sheets');}else{setSyncStatus('','未連接 Google Sheets');}
// init pomo display
updatePomoDisplay();updatePomoModeButtons();
</script>
